[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gideon-client"
version = "0.1.3"
description = "Gideon Client — async Python client for the Gideon Gateway"
readme = "README.md"
license = { text = "Apache-2.0" }
                                                                                 
                                                                
requires-python = ">=3.9"

authors = [
    { name = "Gideon contributors" },
]

keywords = ["gideon", "client", "ai", "agent", "gateway"]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
]

dependencies = ["aiohttp>=3.9"]

                                                                            
                                                                               
                                                                            
                                             
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "hypothesis>=6.0", "aiohttp"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gideon_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
