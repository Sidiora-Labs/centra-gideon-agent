services:
  gideon-gateway:
    image: ${GIDEON_GATEWAY_IMAGE:-gideon-gateway:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - gideon_home:/data:z
    env_file:
      - ../../.env
    environment:
      GIDEON_HOME: /data
      GIDEON_PORT: "10000"
      GIDEON_WORKSPACE: /data/workspace
      GIDEON_BIND_HOST: "0.0.0.0"

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:10000/api/healthz" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  gideon-web:
    image: ${GIDEON_WEB_IMAGE:-gideon-web:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:3443:443"

    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "NGINX_LOCAL_RESOLVERS"
    depends_on:
      gideon-gateway:
        condition: service_healthy

  gideon-slack:
    image: ${GIDEON_GATEWAY_IMAGE:-gideon-gateway:local}
    restart: unless-stopped
    command: [ "gideon", "slack" ]
    profiles:
      - with-slack
    volumes:
      - gideon_home:/data:z
    env_file:
      - ../../.env
    environment:
      GIDEON_HOME: /data
      GIDEON_WORKSPACE: /data/workspace
    depends_on:
      - gideon-gateway

volumes:
  gideon_home:
    driver: local
