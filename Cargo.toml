[workspace]
resolver = "2"
members = [
    "crates/hypermid-contracts",
    "crates/hypermid-foundation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
getrandom = "0.3"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = "0.23"
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = "0.26"
