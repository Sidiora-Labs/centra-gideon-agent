["mcp_servers"]

["mcp_servers"."github"]
"command" = "docker"
"args" = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]

["mcp_servers"."github"."env"]
"GITHUB_PERSONAL_ACCESS_TOKEN" = "invalid-sample-github-personal-access-token"

["mcp_servers"."sampleproject-db"]
"command" = "uvx"
"args" = ["postgres-mcp", "--access-mode=restricted"]
"startup_timeout_sec" = 0

["mcp_servers"."sampleproject-db"."env"]
"DATABASE_URI" = "postgresql://sample:invalid-sample-password@database.example.invalid/sample"

["mcp_servers"."sentry"]
"url" = "https://service.example.invalid/sample"
"bearer_token_env_var" = "SAMPLE_AUTH_TOKEN"

["mcp_servers"."sentry"."http_headers"]
"X-Sentry-Org" = "Synthetic sample text."

["mcp_servers"."openaiDeveloperDocs"]
"url" = "https://service.example.invalid/sample"

["mcp_servers"."notes"]
"command" = "npx"
"args" = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/sampleowner/Notes/Garden"]
"enabled" = false

["projects"]

["projects"."/Users/sampleowner/src/sampleproject"]
"trust_level" = "trusted"

["projects"."/Users/sampleowner/work/samplehooks"]
"trust_level" = "trusted"

["projects"."/Users/sampleowner/work/sampleservice"]
