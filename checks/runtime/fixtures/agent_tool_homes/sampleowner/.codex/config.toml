["sandbox_workspace_write"]
"network_access" = false

["shell_environment_policy"]
"inherit" = "Synthetic sample text."
"exclude" = ["Synthetic sample text.", "Synthetic sample text.", "Synthetic sample text.", "Synthetic sample text."]

["tui"]
"notifications" = true

["history"]
"persistence" = "Synthetic sample text."

["profiles"]

