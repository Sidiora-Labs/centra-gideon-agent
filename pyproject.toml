[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gideon-agent-harness"
version = "0.1.3"
description = "Gideon personal agent runtime, automation, knowledge and client applications"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Gideon contributors" }]
dependencies = ["aiohttp>=3.9,<4", "websockets>=12,<18", "cron-descriptor>=1.4,<3", "croniter>=2.0,<3", "numpy>=1.21,<3", "snowballstemmer>=1.0", "pysqlite3-binary>=0.5.4; sys_platform == 'linux' and platform_machine == 'x86_64'", "sqlite-vec>=0.1,<1", "python-docx>=1.1,<2", "python-dateutil>=2.9,<3", "pdfplumber>=0.11,<1", "python-pptx>=0.6.21,<2", "html2text>=2020.1.16", "reportlab>=4,<6", "trafilatura>=2,<3", "nh3>=0.2", "openpyxl>=3.1,<4", "Pillow>=10,<13", "tree-sitter>=0.21,<1", "tree-sitter-language-pack>=1.0,<2", "httpx>=0.27", "PyYAML>=6,<7", "python-dotenv>=1.0", "argon2-cffi>=23,<26", "cryptography>=42", "jsonschema>=4"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20"]
openai = ["openai>=1.0"]
bedrock = ["boto3>=1.34"]
httpx = ["httpx>=0.27"]
oauth2 = ["cryptography>=42"]
slack = ["slack-sdk>=3.27,<4"]
stt = ["faster-whisper>=1.0"]
tts = ["huggingface-hub>=0.23", "piper-tts>=1.2"]
eval = ["jinja2>=3.0"]
embeddings = ["sentence-transformers>=3.0", "faiss-cpu>=1.7"]
mcp = ["mcp>=1.2,<2"]
js-render = ["playwright>=1.40"]
video = ["yt-dlp==2026.8.19"]
keychain = ["keyring>=24"]
models = ["gideon-agent-harness[embeddings]", "gideon-agent-harness[stt]", "gideon-agent-harness[tts]"]
dev = ["gideon-agent-harness[openai]", "gideon-agent-harness[test]", "gideon-agent-harness[models]", "gideon-agent-harness[mcp]", "gideon-agent-harness[bedrock]", "black>=26,<27", "isort>=8,<9", "flake8>=7,<8", "mypy>=2,<3", "build>=1.0"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-xdist>=3", "pytest-timeout>=2", "pytest-cov>=4", "pytest-split>=0.8", "hypothesis>=6", "setuptools>=64"]

[project.scripts]
gideon = "gideon.interfaces.cli.main:main"

[project.entry-points."gideon.message_source_providers"]
filesystem = "gideon.integrations.inbox_providers.filesystem_source"

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["gideon*"]

[tool.setuptools.package-data]
"gideon.workspace.capabilities.experience.assets" = ["*.applescript", "*.swift", "world-engine/*.js", "world-engine/*.json"]
"gideon" = ["extensions/apps/native/*/*.py", "extensions/apps/native/*/LICENSE", "extensions/apps/native/*/README.md"]
"*" = ["*.json", "*.md", "*.yaml", "*.yml", "*.pub", "py.typed", "*.html", "*.css", "*.js", "*.svg", "*.png", "*.woff2", "**/*.json", "**/*.md", "**/*.yaml", "**/*.yml", "**/*.pub", "**/*.html", "**/*.css", "**/*.js", "**/*.svg", "**/*.png", "**/*.woff2"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["gideon"]

[tool.pytest.ini_options]
testpaths = ["checks/runtime"]
pythonpath = ["runtime", ".", "checks/runtime"]
xfail_strict = true
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
exclude = '^runtime/gideon/extensions/apps/native/'
mypy_path = "runtime"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["gideon"]
