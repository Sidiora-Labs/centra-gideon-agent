<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to anything but 0px.
      This is the shell's OWN document; the served companion gets its insets natively instead
      (see `platform/safe-area.mjs`).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gideon</title>
    <link rel="stylesheet" href="bootstrap/shell.css" />
  </head>
  <body>
    
    <main id="shell">
      <div class="identity"><picture><source media="(prefers-color-scheme: dark)" srcset="assets/gideon-dark.png"><img src="assets/gideon-light.png" width="56" height="56" alt=""></picture><h1>Gideon</h1></div>
      <p class="lede">Connect this device to your gateway.</p>
      <form id="connect">
        <label for="gateway">Gateway address</label>
        <input
          id="gateway"
          name="gateway"
          type="text"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="192.168.1.10:10000"
          required
        />
        <button type="submit">Connect</button>
      </form>
      <p id="status" role="alert" hidden></p>
      <p class="hint">
        Run <code>gideon status</code> on the machine running your gateway to see its
        address, or pair this device from Settings &rsaquo; Devices.
      </p>
    </main>
    <script type="module" src="bootstrap/start.mjs"></script>
  </body>
</html>
