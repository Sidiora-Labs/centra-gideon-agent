#
                                                                                    
                                                                        
name: validate-listings

on:
  pull_request:
    paths:
      - app-registry.json
      - validate_registry.py
      - requirements.txt

concurrency:
  group: validate-listings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
                                                                                   
                                                                                     
                                           
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the validator's dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Recover the base branch's app-registry.json
                                                                                  
                                                                                  
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:app-registry.json" > base-app-registry.json \
            || printf '{"apps": []}\n' > base-app-registry.json

      - name: Validate the changed listings
        id: validate
        run: |
          set +e
          uv run python validate_registry.py app-registry.json \
            --base base-app-registry.json \
            --report registry-report.json \
            --markdown registry-report.md
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat registry-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Record the verdict for the comment job
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
        run: |
          printf '%s\n' "${PR_NUMBER}" > pr-number.txt
          printf '%s\n' "${EXIT_CODE}" > exit-code.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registry-validation
          path: |
            registry-report.md
            registry-report.json
            pr-number.txt
            exit-code.txt
          retention-days: 7

      - name: Fail the check when a listing is blocked
                                                                                      
                                                     
        run: exit "${{ steps.validate.outputs.exit_code }}"
