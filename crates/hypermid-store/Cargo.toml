[package]
name = "hypermid-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
hypermid-contracts = { path = "../hypermid-contracts" }
hypermid-core = { path = "../hypermid-core" }
hypermid-leases = { path = "../hypermid-leases" }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
