name: Full
'on':
  push:
    branches:
    - main
  schedule:
  - cron: 0 7 * * *
  workflow_dispatch: {}
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  matrix-shard:
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.12'
        - '3.13'
        os:
        - ubuntu-latest
        - macos-latest
        shard:
        - 1
        - 2
        - 3
        - 4
        include:
        - python: '3.13'
          os: ubuntu-24.04-arm
          shard: 1
        - python: '3.13'
          os: ubuntu-24.04-arm
          shard: 2
        - python: '3.13'
          os: ubuntu-24.04-arm
          shard: 3
        - python: '3.13'
          os: ubuntu-24.04-arm
          shard: 4
        - python: '3.13'
          os: macos-14
          shard: 1
        - python: '3.13'
          os: macos-14
          shard: 2
        - python: '3.13'
          os: macos-14
          shard: 3
        - python: '3.13'
          os: macos-14
          shard: 4
    runs-on: ${{ matrix.os }}
    env:
      GIDEON_SKIP_APP_BACKENDS: '1'
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python }}
      run: uv python install ${{ matrix.python }}
    - name: Install (locked)
      run: uv sync --locked --extra dev --python ${{ matrix.python }}
    - name: "Install tmux (EI-6 durable sessions \u2014 real-daemon test leg)"
      run: |
        if command -v tmux >/dev/null 2>&1; then tmux -V; exit 0; fi
        case "$RUNNER_OS" in
          Linux) sudo apt-get update -qq &&
                 sudo apt-get install -y --no-install-recommends tmux ;;
          macOS) brew install tmux ;;
          *) echo "no tmux installer known for RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
        esac
        tmux -V
    - name: pytest (shard ${{ matrix.shard }} of 4)
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          uv run pytest --no-cov -n 2 -q --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration \
            --junitxml=reports/full-matrix-shard-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.shard }}.junit.xml
        else
          uv run pytest --no-cov -q --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration \
            --junitxml=reports/full-matrix-shard-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.shard }}.junit.xml
        fi
    - name: Upload the matrix shard test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-report-full-matrix-shard-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.shard }}
        path: reports/
        if-no-files-found: ignore
        retention-days: 7
  matrix:
    needs:
    - matrix-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: every matrix shard passed
      run: |
        result='${{ needs.matrix-shard.result }}'
        if [ "$result" != "success" ]; then
          echo "::error title=matrix shards failed::the sharded matrix result was '$result'" \
               "(expected 'success'). Open the red 'matrix-shard (...)' leg(s) above."
          exit 1
        fi
        echo "all matrix shards passed"
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: pip-audit
      run: |
        uv venv --python 3.12 .venv-audit
        uv pip install --python .venv-audit/bin/python -e . pip-audit
        .venv-audit/bin/python -m pip_audit || true
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - name: npm audit (root workspace)
      run: npm ci && npm audit || true
  security-corpus:
    runs-on: ubuntu-latest
    env:
      GIDEON_SKIP_APP_BACKENDS: '1'
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install (locked)
      run: uv sync --locked --extra dev
    - name: pytest (adversarial scanner corpus)
      run: |
        uv run pytest -n 0 --no-cov checks/runtime/security checks/runtime/test_supply_chain_scanner.py checks/runtime/test_supply_chain_gates.py \
          --junitxml=reports/full-security-corpus.junit.xml
    - name: Upload the security corpus test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-report-full-security-corpus
        path: reports/
        if-no-files-found: ignore
        retention-days: 7
  coverage:
    runs-on: ubuntu-latest
    env:
      GIDEON_SKIP_APP_BACKENDS: '1'
      GIDEON_SHORT_TEST_IDS: '1'
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install (locked)
      run: uv sync --locked --extra dev
    - name: pytest with coverage XML
      run: uv run pytest --cov=gideon --cov-report=xml --junitxml=reports/full-coverage.junit.xml
    - name: "Coverage badge (self-owned shields JSON \u2014 no third-party service)"
      run: |
        uv run python - <<'PY'
        import json, xml.etree.ElementTree as ET
        rate = float(ET.parse("coverage.xml").getroot().get("line-rate", "0")) * 100
        color = "brightgreen" if rate >= 85 else "green" if rate >= 70 else "yellow" if rate >= 50 else "red"
        json.dump({"schemaVersion": 1, "label": "coverage",
                   "message": f"{rate:.0f}%", "color": color},
                  open("coverage-badge.json", "w"))
        print(f"coverage {rate:.1f}%")
        PY
        # Owner task (S4): publish coverage-badge.json to a gist/website repo and
        # point a README shields endpoint at it. Emitted as an artifact until then.
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage.xml
          coverage-badge.json
        if-no-files-found: warn
    - name: Upload the coverage test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-report-full-coverage
        path: reports/
        if-no-files-found: ignore
        retention-days: 7
  install-smoke:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    timeout-minutes: 20
    steps:
    - name: bare-container prerequisites (curl · CA roots · diff)
      run: |
        set -eu
        apt-get update -qq
        apt-get install -y --no-install-recommends ca-certificates curl diffutils
    - uses: actions/checkout@v7
    - name: smoke — the STAGED installer (infrastructure/website/install.sh)
      if: ${{ !cancelled() }}
      run: |
        set -eu
        UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-staged"
        UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-staged"
        export UV_TOOL_DIR UV_TOOL_BIN_DIR
        mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
        PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
        sh infrastructure/website/install.sh
        # Installing proves a wheel downloaded. Running it proves the front door opens.
        gideon --version
    - name: smoke — the SERVED one-liner (configured installer endpoint)
      if: ${{ !cancelled() }}
      run: |
        set -eu
        set -o pipefail
        UV_TOOL_DIR="$RUNNER_TEMP/uv-tools-served"
        UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin-served"
        export UV_TOOL_DIR UV_TOOL_BIN_DIR
        mkdir -p "$UV_TOOL_DIR" "$UV_TOOL_BIN_DIR"
        PATH="$UV_TOOL_BIN_DIR:$PATH"; export PATH
        if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
               "$GIDEON_INSTALL_URL" | sh; then
          echo "::error title=install one-liner unproven::unproven — the served one-liner did" \
               "not complete. If the configured installer or package source is unreachable this run proved" \
               "NOTHING; it is red rather than green because an unanswered question is not a" \
               "passing answer. Re-run once reachability is confirmed."
          exit 1
        fi
        gideon --version
    - name: drift — served bytes must equal the staged file
      if: ${{ !cancelled() }}
      run: |
        set -eu
        served="$RUNNER_TEMP/served-install.sh"
        if ! curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
               -o "$served" "$GIDEON_INSTALL_URL"; then
          echo "::error title=install drift unproven::unproven — could not fetch" \
               "$GIDEON_INSTALL_URL, so whether the mirror has drifted is" \
               "UNKNOWN. Reported red deliberately: an unanswered question must not arrive" \
               "as a green check."
          exit 1
        fi
        if [ ! -s "$served" ]; then
          echo "::error title=install drift unproven::unproven — /install returned 0 bytes." \
               "Nothing was compared."
          exit 1
        fi
        served_sum=$(sha256sum "$served" | cut -d' ' -f1)
        staged_sum=$(sha256sum infrastructure/website/install.sh | cut -d' ' -f1)
        pinned_sum=$(cut -d' ' -f1 < infrastructure/website/install.sh.sha256)
        echo "served=$served_sum"
        echo "staged=$staged_sum"
        echo "pinned=$pinned_sum"
        # staged-vs-pinned is already gated offline in checks/runtime/test_website_installer.py. Repeated
        # here so this leg's verdict does not depend on another job having run.
        if [ "$staged_sum" != "$pinned_sum" ]; then
          echo "::error title=install pin stale::infrastructure/website/install.sh.sha256 does not" \
               "match install.sh. Update the pin in the same change as the script."
          exit 1
        fi
        if [ "$served_sum" != "$pinned_sum" ]; then
          echo "::error title=install one-liner drift::the bytes served at" \
               "$GIDEON_INSTALL_URL are NOT the bytes staged here. Users are" \
               "running something this repo does not lint or test. Re-apply" \
               "infrastructure/website/install.sh to the configured endpoint (see" \
               "infrastructure/website/README.md) and re-run."
          diff -u infrastructure/website/install.sh "$served" || true
          exit 1
        fi
        echo "served bytes are identical to the staged installer ($served_sum)"
    if: ${{ vars.GIDEON_INSTALL_URL != '' && vars.GIDEON_PACKAGE_SOURCE != '' }}
    env:
      GIDEON_INSTALL_URL: ${{ vars.GIDEON_INSTALL_URL }}
      GIDEON_PACKAGE_SOURCE: ${{ vars.GIDEON_PACKAGE_SOURCE }}
    defaults:
      run:
        shell: bash
  registry-verdicts:
    runs-on: ubuntu-latest
    env:
      GIDEON_SKIP_APP_BACKENDS: '1'
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install (locked)
      run: uv sync --locked --extra dev
    - name: "measure \u2014 validate every shipped listing and stamp a copy"
      run: |
        set -eu
        cp examples/registry/app-registry.json "$RUNNER_TEMP/measured.json"
        uv run python examples/registry/validate_registry.py \
          "$RUNNER_TEMP/measured.json" --write \
          --markdown "$GITHUB_STEP_SUMMARY" \
          --report "$RUNNER_TEMP/report.json"
    - name: "compare \u2014 no listing may have lost or outlived its verdict"
      env:
        MEASURED: ${{ runner.temp }}/measured.json
      run: "uv run python - <<'PY'\nimport json, os, sys\nfrom pathlib import Path\n\ncommitted = json.loads(Path(\"\
        examples/registry/app-registry.json\").read_text(\"utf-8\"))\nmeasured = json.loads(Path(os.environ[\"MEASURED\"\
        ]).read_text(\"utf-8\"))\nrows = {r[\"name\"]: r for r in committed[\"apps\"]}\nfresh = {r[\"name\"]: r\
        \ for r in measured[\"apps\"]}\n\nproblems = []\n# ANTI-VACUITY, and it is the first check on purpose: every\
        \ loop below is green over\n# an empty registry, so an index that lost its listings would pass this job\
        \ while\n# proving nothing at all.\nif not rows:\n    problems.append(\n        \"the shipped app-registry.json\
        \ lists NOTHING \u2014 every check below would pass \"\n        \"vacuously over it\"\n    )\nfor name,\
        \ row in sorted(rows.items()):\n    want = fresh.get(name, {}).get(\"last_scan_verdict\")\n    got = row.get(\"\
        last_scan_verdict\")\n    if got is None:\n        problems.append(\n            f\"{name}: carries no 'last_scan_verdict'.\
        \ The pre-install surface renders \"\n            f\"that as \\\"No scan on record\\\", which is what an\
        \ UNSCANNED listing looks \"\n            f\"like \u2014 this one measured {want!r}.\"\n        )\n    elif\
        \ want is not None and got != want:\n        problems.append(\n            f\"{name}: committed verdict\
        \ {got!r} but this run measured {want!r}. The \"\n            f\"published verdict is stale.\"\n       \
        \ )\n    if not row.get(\"last_validated\"):\n        problems.append(f\"{name}: carries no 'last_validated'\
        \ date.\")\n\nif problems:\n    for problem in problems:\n        print(f\"::error title=registry verdict::{problem}\"\
        )\n    print(\n        \"Re-stamp with: python examples/registry/validate_registry.py \"\n        \"examples/registry/app-registry.json\
        \ --write   (then commit the result)\",\n        file=sys.stderr,\n    )\n    raise SystemExit(1)\nprint(f\"\
        {len(rows)} shipped listing(s), each carrying the verdict this run measured\")\nPY\n"
