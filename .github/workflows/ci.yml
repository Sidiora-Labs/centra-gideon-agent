


#






#




name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]                                                 




#








#





#




concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read                                                                     


      pull-requests: read                                                                  



    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # `checks/harness/` is repo-inner dev infra beside src/ (SELF-VERIFICATION). `make lint`



      #



      - name: lint (black --check · isort --check · flake8 · mypy)
        id: lint
        run: |
          status=0
          : > /tmp/lint-out.txt
          run_tool() {
            label=$1
            shift
            if out=$("$@" 2>&1); then
              printf '%s\n' "$out"
            else
              status=1
              printf '%s\n' "$out"
              { echo "**$label**"; echo '```'; printf '%s\n' "$out"; echo '```'; } >> /tmp/lint-out.txt
            fi
          }
          run_tool "black --check" uv run black --check runtime/gideon checks/runtime checks/harness
          run_tool "isort --check-only" uv run isort --check-only runtime/gideon checks/runtime checks/harness
          run_tool "flake8" uv run flake8 runtime/gideon checks/runtime checks/harness
          run_tool "mypy" uv run mypy runtime/gideon checks/harness
          if [ "$status" -ne 0 ]; then
            {
              echo "violations<<LINTEOF"
              cat /tmp/lint-out.txt
              echo "LINTEOF"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      #






      #



      #








      #


      - name: Resolve the PR number for the feedback relay
        id: prnum
        if: failure() && steps.lint.outputs.violations != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          if [ -n "${EVENT_PR:-}" ]; then
            # `pull_request`, including every fork PR — the payload already carries it, so the
            # read-only fork token never has to make the API call below.
            number="$EVENT_PR"
          else
            number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${HEAD_BRANCH}" \
              --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          printf 'number=%s\n' "${number:-}" >> "$GITHUB_OUTPUT"
          echo "feedback relay target: PR ${number:-<none — nothing will be posted>}"
      - name: Hand the violations to the feedback workflow
        if: failure() && steps.lint.outputs.violations != '' && steps.prnum.outputs.number != ''







        env:
          VIOLATIONS: ${{ steps.lint.outputs.violations }}
          PR_NUMBER: ${{ steps.prnum.outputs.number }}
        run: |
          mkdir -p /tmp/lint-feedback
          printf '%s' "$VIOLATIONS" > /tmp/lint-feedback/violations.md
          # `workflow_run` payloads carry an EMPTY `pull_requests` array for fork PRs, so the
          # relay cannot look the number up — it has to be carried across in the artifact.
          printf '%s' "$PR_NUMBER" > /tmp/lint-feedback/pr.txt
          wc -c /tmp/lint-feedback/violations.md /tmp/lint-feedback/pr.txt
      - name: Upload lint feedback
        if: failure() && steps.lint.outputs.violations != '' && steps.prnum.outputs.number != ''
        uses: actions/upload-artifact@v7
        with:
          name: lint-feedback
          path: /tmp/lint-feedback/
          retention-days: 3

      # `infrastructure/website/install.sh` is what `curl -fsSL the configured installer endpoint | sh`
      # runs on a stranger's machine, and its header advertised "shellcheck-clean" plus a weekly

      # .github/workflows/ for `website/install`, `install.sh` or `the configured installer endpoint`


      #




      #


      # shellcheck must red HERE rather than turn the cases below into quiet skips — which is
      # precisely what GIDEON_REQUIRE_INSTALL_PROOF converts a missing linter into.
      #



      - name: install one-liner — shellcheck · sh -n · dash -n · offline contract
        if: ${{ !cancelled() }}
        env:
          GIDEON_REQUIRE_INSTALL_PROOF: "1"
        run: |
          set -eu
          for tool in shellcheck dash; do
            command -v "$tool" >/dev/null 2>&1 || {
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends "$tool"
            }
          done
          shellcheck --version | head -2
          sh -n infrastructure/website/install.sh
          dash -n infrastructure/website/install.sh
          shellcheck -s sh infrastructure/website/install.sh
          # -n0: the truncation sweep is ~170 tiny `sh` invocations; xdist buys nothing.
          uv run pytest checks/runtime/test_website_installer.py -n0 --no-cov \
            --junitxml=reports/ci-lint-website-installer.junit.xml
      - name: Upload the lint test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-lint
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  test-shard:








    #



    #





    runs-on: ubuntu-latest
    strategy:



      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # NOTE: do NOT set GIDEON_HOME here. The suite runs under the documented


      # ~/.gideon resolution or patch Path.home(), and config_dir() gives
      # GIDEON_HOME precedence over Path.home(), so a global value defeats those

      GIDEON_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev






      #



      #


      - name: Install tmux (EI-6 durable sessions — real-daemon test leg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V
      - name: pytest (shard ${{ matrix.shard }} of 4 — xdist within the shard, no coverage)







        run: uv run pytest --no-cov -q --splits 4 --group ${{ matrix.shard }} --splitting-algorithm least_duration
          --junitxml=reports/ci-test-shard-${{ matrix.shard }}.junit.xml
      - name: Upload the shard test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-test-shard-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  test:






    needs: [test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: every test shard passed
        run: |
          result='${{ needs.test-shard.result }}'
          if [ "$result" != "success" ]; then
            echo "::error title=test shards failed::the sharded test matrix result was '$result'" \
                 "(expected 'success'). Open the red 'test-shard (N)' job(s) above for the failing tests."
            exit 1
          fi
          echo "all 4 test shards passed"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm


      - name: npm ci (root)
        run: npm ci
      - name: prepare the report directory
        run: mkdir -p reports
      - name: typecheck
        run: npm run typecheck:web
      - name: test (vitest)
        env:
          VITEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-web-vitest.junit.xml










        run: npm run test:web
      - name: test (desktop, node --test)
        # apps/desktop/ is the OTHER member of this single root workspace, so the `npm ci`











        run: npm run test:desktop
      - name: test (mobile, node --test)
        # apps/mobile/ is the THIRD member of this single root workspace (the Capacitor shell that




        # and the Android SDK, so they are a maintainer step documented in apps/mobile/README.md.
        run: npm run test:mobile
      - name: build (tsc + vite)
        run: npm run build




      # caught it. Same script as the local pre-push gate (tooling/scripts/run_prepush.sh).
      - name: install chromium (render smoke)
        run: npx playwright install --with-deps chromium
      - name: render smoke (built SPA mounts in a real browser)
        run: npm run smoke:render
      - name: Upload the web test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-web
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  e2e-pwa:








    #



    #





    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The config's `webServer` starts `../.venv/bin/gideon`, so the gateway must import

      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: service worker never caches /api (apps/console/e2e/pwa.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-pwa.junit.xml
        run: npx playwright test e2e/pwa.spec.ts --project=chromium
      - name: upload the traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-traces
          path: apps/console/test-results/
          if-no-files-found: ignore
      - name: Upload the e2e-pwa test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-e2e-pwa
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  e2e-a11y:







    #

    # (GIDEON_HOME under $TMPDIR, never a real home) and captures its token from the
    # GIDEON_READY line, then builds and previews the SPA against it. So this job needs both


    #
    # Auth stays ON — no GIDEON_AUTH_MODE=none, which would swap the csrf middleware for the

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The harness starts `../.venv/bin/gideon`, so the gateway must be importable.
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium


      - name: axe per route, both themes (apps/console/e2e/a11y.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: a11y-report.json
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-axe.junit.xml
        run: npx playwright test e2e/a11y.spec.ts --project=chromium --reporter=github,json,junit





      - name: every authenticated route was actually SCANNED (not skipped)
        working-directory: apps/console
        run: node e2e/assert-no-route-skips.mjs a11y-report.json






      - name: non-axe a11y detectors still recognise their defects (apps/console/e2e/nonAxeA11yChecks.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-nonaxe.junit.xml
        run: npx playwright test e2e/nonAxeA11yChecks.spec.ts --project=chromium





      - name: app-authored DOM is really mounted and swept (apps/console/e2e/appSurface.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-appsurface.junit.xml
        run: npx playwright test e2e/appSurface.spec.ts --project=chromium




      - name: V3 walkthrough — keyboard / reduced-motion / phone (apps/console/e2e/walkthrough.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-walkthrough.junit.xml
        run: npx playwright test e2e/walkthrough.spec.ts --project=chromium







      - name: offline scripted chat turn (apps/console/e2e/chat.spec.ts)
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-chat.junit.xml
        run: npx playwright test e2e/chat.spec.ts --project=chromium
      - name: desktop Session Map accessibility and keyboard navigation
        working-directory: apps/console
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/ci-e2e-a11y-session-map.junit.xml
        run: npx playwright test e2e/sessionMap.spec.ts --project=chromium
      - name: upload the axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-violations
          path: apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the e2e-a11y test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-e2e-a11y
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  browse-live:






    #




    #












    runs-on: ubuntu-latest


    timeout-minutes: 15
    env:







      GIDEON_REQUIRE_BROWSE_PROOF: "1"
      # Same reason as the `test` job: no GIDEON_HOME (the no-global-home contract), and

      GIDEON_SKIP_APP_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev






      - name: npm ci (root)
        run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium





      - name: BA-2 behavioural proof in a REAL browser (safety script · redirect re-eval)
        run: uv run pytest checks/runtime/test_browse_safety_script.py checks/runtime/test_browse_cdp_live.py checks/runtime/test_browse_behavioural_proof_is_reachable.py -n0
          --junitxml=reports/ci-browse-live.junit.xml
      - name: Upload the browse-live test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-browse-live
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  rails:


    runs-on: ubuntu-latest
    # No GIDEON_HOME (see the test job) — the residue sweep is a static

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev



      - name: provider-boundary residue sweep (plan 32)
        run: uv run pytest checks/runtime/test_provider_boundary_residue.py -n0
          --junitxml=reports/ci-rails.junit.xml

      # `make gates` (tooling/scripts/gate_report.py) is the one surface that reports all six ratchets




      #


      # for machine-checked invariants. It imports only `tooling/scripts/*` + stdlib, so it needs no
      # GIDEON_HOME — consistent with this job's no-global-home contract.
      - name: gate aggregate (make gates)
        run: uv run python tooling/scripts/gate_report.py
      - name: Upload the rails test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-rails
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  harness:
    # Self-verification gate (SELF-VERIFICATION SV-7): the repo-inner checks/harness/ package




    # (WARNINGs stay advisory). The checks/harness/ unit tests themselves ride the `test` job

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:



          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: harness validate (spec shape + reference resolution)
        run: |
          set -o pipefail
          mkdir -p reports
          uv run python -m checks.harness validate 2>&1 | tee reports/ci-harness-validate.log
      - name: harness scan (static boundary scanner over the diff)
        run: |
          set -o pipefail
          mkdir -p reports
          uv run python -m checks.harness scan --diff 2>&1 | tee reports/ci-harness-scan.log
      - name: Upload the harness test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-harness
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  client:
    # gideon-client (packages/python-client) is versioned + published



    # (plan 34 T2.3). No GIDEON_HOME — the runner's $HOME is ephemeral, so the
    # data-dir test resolves ~/.gideon as intended.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the client (proves packaging metadata is valid)


        run: |
          uv python install 3.12
          uv build packages/python-client --out-dir dist-client
      - name: Test the client (its own deps)
        run: |
          uv venv .venv-client
          uv pip install --python .venv-client "packages/python-client[dev]"
          .venv-client/bin/python -m pytest packages/python-client/tests \
            --junitxml=reports/ci-client.junit.xml
      - name: Upload the client test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-ci-client
          path: reports/
          if-no-files-found: ignore
          retention-days: 7





