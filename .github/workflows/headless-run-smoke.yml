# Headless CLI smoke test — `gideon run` (EXTERNAL-ACCESS §9.5).
#

# package and drives the `gideon run` command a CI pipeline would actually type.
#




#


name: headless-run-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"                      

concurrency:
  group: headless-run-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest


    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra dev





      - name: run is registered and refuses a blank prompt
        run: |
          uv run gideon run --help > /dev/null
          if uv run gideon run -p "" 2>/dev/null; then
            echo "::error::an empty prompt was accepted — the guard is inert"
            exit 1
          fi
          echo "blank-prompt guard holds"

      - name: Configure an isolated home
        run: |
          echo "GIDEON_HOME=${{ runner.temp }}/gideon-home" >> "$GITHUB_ENV"



      - name: Bind a chat model
        id: bind
        env:
          GIDEON_SMOKE_CREDENTIAL: ${{ secrets.GIDEON_SMOKE_CREDENTIAL }}
          GIDEON_SMOKE_PROVIDER: ${{ vars.GIDEON_SMOKE_PROVIDER }}
        run: |
          if [ -z "${GIDEON_SMOKE_CREDENTIAL:-}" ]; then
            echo "no GIDEON_SMOKE_CREDENTIAL — skipping the turn half of the smoke test"
            echo "bound=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run gideon setup --agent-only
          uv run gideon setup \
            --provider "${GIDEON_SMOKE_PROVIDER:?set the GIDEON_SMOKE_PROVIDER repo variable}" \
            --credential "GIDEON_SMOKE_CREDENTIAL"
          echo "bound=true" >> "$GITHUB_OUTPUT"

      - name: Headless turn smoke test
        if: steps.bind.outputs.bound == 'true'
        run: bash tooling/scripts/ci_smoke_run.sh




      - name: No gateway left running
        if: always()
        run: |
          if pgrep -f "gideon gateway" > /dev/null; then
            echo "::error::a gateway survived the run — transient teardown leaked"
            pgrep -af "gideon gateway" || true
            exit 1
          fi
          echo "no gateway left running"
